<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Городской скетч улицы">
  <defs>
    <pattern id="win5" width="30" height="38" patternUnits="userSpaceOnUse">
      <rect x="6" y="7" width="18" height="24" fill="none" stroke="#3E3A34" stroke-width="1.1" opacity=".5"/>
      <path d="M15 7 v24" stroke="#3E3A34" stroke-width=".8" opacity=".35"/>
    </pattern>
    <linearGradient id="sky5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7E2D4"/>
      <stop offset="1" stop-color="#F3EDDD"/>
    </linearGradient>
    <filter id="n5">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="b5" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#sky5)"/>
  <ellipse cx="620" cy="170" rx="160" ry="90" fill="#CDB68A" opacity=".25" filter="url(#b5)"/>

  <!-- facades -->
  <g>
    <!-- building A -->
    <rect x="30" y="286" width="196" height="392" fill="#EDE5D2"/>
    <rect x="30" y="286" width="196" height="392" fill="url(#win5)" opacity=".85"/>
    <path d="M22 286 H234" stroke="#3E3A34" stroke-width="4"/>
    <path d="M22 286 l 10 -18 H224 l 10 18" fill="none" stroke="#3E3A34" stroke-width="2.6"/>
    <rect x="96" y="238" width="26" height="30" fill="#DED4BE" stroke="#3E3A34" stroke-width="2"/>
    <rect x="112" y="392" width="32" height="286" fill="#E3D9C2" stroke="#3E3A34" stroke-width="1.6"/>
    <!-- building B -->
    <rect x="236" y="358" width="150" height="320" fill="#E8DFC9"/>
    <rect x="236" y="358" width="150" height="320" fill="url(#win5)" opacity=".8"/>
    <path d="M228 358 H394" stroke="#3E3A34" stroke-width="3.6"/>
    <path d="M236 358 c 18 -26 40 -34 74 -34 c 34 0 58 8 76 34" fill="none" stroke="#3E3A34" stroke-width="2.4"/>
    <!-- building C -->
    <rect x="396" y="312" width="180" height="366" fill="#EFE7D5"/>
    <rect x="396" y="312" width="180" height="366" fill="url(#win5)" opacity=".85"/>
    <path d="M388 312 H584" stroke="#3E3A34" stroke-width="4"/>
    <path d="M396 312 h180 v-14 h-180 z" fill="#DDD2BA" stroke="#3E3A34" stroke-width="1.6"/>
    <!-- building D -->
    <rect x="586" y="404" width="184" height="274" fill="#E6DCC5"/>
    <rect x="586" y="404" width="184" height="274" fill="url(#win5)" opacity=".75"/>
    <path d="M578 404 H778" stroke="#3E3A34" stroke-width="3.6"/>
    <path d="M586 404 l 92 -30 l 92 30" fill="none" stroke="#3E3A34" stroke-width="2.4"/>
    <!-- windowsills / details -->
    <g stroke="#3E3A34" stroke-width="1.2" opacity=".45">
      <path d="M30 330 H226 M30 406 H226 M30 482 H226 M30 558 H226"/>
      <path d="M236 402 H386 M236 478 H386 M236 554 H386"/>
      <path d="M396 356 H576 M396 432 H576 M396 508 H576"/>
    </g>
  </g>

  <!-- washes -->
  <g mix-blend-mode="multiply">
    <path d="M30 560 H226 V678 H30 Z" fill="#8FA3A6" opacity=".18"/>
    <path d="M396 550 H576 V678 H396 Z" fill="#9AA7A0" opacity=".14"/>
    <ellipse cx="700" cy="650" rx="120" ry="50" fill="#7E8F92" opacity=".12"/>
  </g>

  <!-- ground -->
  <path d="M0 678 H800" stroke="#3E3A34" stroke-width="3"/>
  <path d="M0 712 H800" stroke="#3E3A34" stroke-width="1.6" opacity=".5"/>
  <g stroke="#4A453D" stroke-width="1.1" opacity=".35">
    <path d="M40 700 h84 M160 700 h60 M260 700 h96 M420 700 h70 M540 700 h120 M700 700 h60"/>
  </g>

  <!-- tree -->
  <g>
    <path d="M690 678 C 686 620 690 574 682 534" fill="none" stroke="#4B4436" stroke-width="6" stroke-linecap="round"/>
    <path d="M682 574 C 660 556 648 540 642 520" fill="none" stroke="#4B4436" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M684 550 C 706 528 718 516 726 498" fill="none" stroke="#4B4436" stroke-width="3" stroke-linecap="round"/>
    <g fill="#6F7A5A" opacity=".55">
      <ellipse cx="668" cy="520" rx="46" ry="30" transform="rotate(-12 668 520)"/>
      <ellipse cx="712" cy="492" rx="40" ry="26" transform="rotate(14 712 492)"/>
      <ellipse cx="682" cy="486" rx="34" ry="22"/>
    </g>
    <g stroke="#4F5B41" stroke-width="1.4" opacity=".5" fill="none">
      <path d="M646 512 c 12 -10 26 -12 40 -8"/>
      <path d="M692 500 c 14 -8 26 -8 38 -4"/>
    </g>
  </g>

  <!-- lamp post -->
  <g stroke="#3E3A34" fill="none">
    <path d="M120 678 V520" stroke-width="4"/>
    <path d="M120 520 h40" stroke-width="3.4"/>
    <path d="M160 520 l-14 14 h-14 l-14 -14 z" fill="#3E3A34" opacity=".8"/>
  </g>

  <!-- figure -->
  <g fill="#4A4239" opacity=".72">
    <ellipse cx="330" cy="646" rx="7" ry="9"/>
    <path d="M330 655 c -6 16 -8 22 -8 28 h6 l4 -14 4 14 h6 c 0 -8 -2 -14 -6 -28 z"/>
  </g>

  <rect width="800" height="800" filter="url(#n5)" opacity=".2" style="mix-blend-mode:multiply"/>
</svg>
