<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-label="Линеарный портрет: три линии">
  <defs>
    <radialGradient id="w4" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#D9A24B" stop-opacity=".38"/>
      <stop offset=".62" stop-color="#D9A24B" stop-opacity=".14"/>
      <stop offset="1" stop-color="#D9A24B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="w4b" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3D5A54" stop-opacity=".16"/>
      <stop offset="1" stop-color="#3D5A54" stop-opacity="0"/>
    </radialGradient>
    <filter id="n4">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="b4" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1000" height="700" fill="#F5EEDF"/>
  <circle cx="600" cy="316" r="250" fill="url(#w4)"/>
  <ellipse cx="700" cy="470" rx="260" ry="180" fill="url(#w4b)"/>

  <!-- line 1: profile -->
  <path d="M470 190 C 500 150 570 148 600 190 C 612 210 606 232 610 248 C 616 268 636 300 640 314 C 642 322 630 326 620 324 C 612 330 616 338 612 344 C 616 350 610 356 612 362 C 606 372 596 378 588 384 C 578 394 574 410 572 428 C 566 456 556 470 544 484"
        fill="none" stroke="#20201D" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- line 2: hair -->
  <path d="M470 190 C 410 186 358 226 348 292 C 340 344 350 396 372 430 C 384 448 398 458 408 462"
        fill="none" stroke="#20201D" stroke-width="3" stroke-linecap="round"/>
  <path d="M420 196 C 380 220 366 262 372 300" fill="none" stroke="#20201D" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>

  <!-- line 3: shoulders -->
  <path d="M544 484 C 556 506 584 516 616 518 M470 494 C 448 508 424 514 396 516"
        fill="none" stroke="#20201D" stroke-width="3" stroke-linecap="round"/>

  <!-- minimal face marks -->
  <path d="M596 268 c 10 -4 20 -4 28 0" fill="none" stroke="#20201D" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M618 292 c 4 4 4 8 0 10" fill="none" stroke="#20201D" stroke-width="2" stroke-linecap="round" opacity=".7"/>

  <!-- ochre accents -->
  <path d="M604 182 C 646 200 664 240 660 280" fill="none" stroke="#C0773A" stroke-width="2.2" stroke-linecap="round" opacity=".55"/>
  <ellipse cx="560" cy="352" rx="34" ry="22" fill="#C98A56" opacity=".22" filter="url(#b4)"/>

  <rect width="1000" height="700" filter="url(#n4)" opacity=".16" style="mix-blend-mode:multiply"/>
</svg>
