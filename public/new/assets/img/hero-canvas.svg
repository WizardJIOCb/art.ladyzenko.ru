<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" role="img" aria-label="Акварельный пейзаж: тёплый вечер над водой">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2=".18" y2="1">
      <stop offset="0" stop-color="#F2D8AE"/>
      <stop offset=".36" stop-color="#E9B486"/>
      <stop offset=".64" stop-color="#D28D6E"/>
      <stop offset="1" stop-color="#9E6B63"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D49E79"/>
      <stop offset=".28" stop-color="#AB7A66"/>
      <stop offset="1" stop-color="#584447"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFF2D6" stop-opacity=".95"/>
      <stop offset=".42" stop-color="#FBD79F" stop-opacity=".46"/>
      <stop offset="1" stop-color="#FBD79F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx=".5" cy=".44" r=".78">
      <stop offset=".52" stop-color="#33231F" stop-opacity="0"/>
      <stop offset="1" stop-color="#33231F" stop-opacity=".3"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="900" height="1100" fill="url(#sky)"/>
  <rect y="686" width="900" height="414" fill="url(#water)"/>

  <!-- light -->
  <circle cx="548" cy="628" r="230" fill="url(#glow)"/>
  <circle cx="548" cy="622" r="44" fill="#FFF4D9" opacity=".94"/>
  <circle cx="548" cy="622" r="44" fill="none" stroke="#FFEDC6" stroke-width="10" opacity=".4" filter="url(#soft)"/>

  <!-- clouds -->
  <ellipse cx="235" cy="318" rx="182" ry="24" fill="#F8E2C4" opacity=".48" filter="url(#soft)"/>
  <ellipse cx="330" cy="418" rx="140" ry="15" fill="#F2D3B1" opacity=".4" filter="url(#soft)"/>
  <ellipse cx="700" cy="372" rx="150" ry="18" fill="#F6D8B6" opacity=".38" filter="url(#soft)"/>
  <ellipse cx="640" cy="240" rx="110" ry="12" fill="#F8E4C7" opacity=".3" filter="url(#soft)"/>

  <!-- distant shore -->
  <path d="M0 690 C 90 672 150 682 210 676 C 300 668 340 690 420 684 C 520 676 560 690 640 686 C 740 681 800 694 900 684 L900 706 L0 706 Z" fill="#7B5650" opacity=".85"/>
  <path d="M0 686 C 120 670 200 684 300 678 C 420 670 470 684 580 680 C 690 676 780 690 900 680 L900 690 L0 690 Z" fill="#5F4541" opacity=".7"/>

  <!-- water -->
  <rect y="704" width="900" height="396" fill="url(#water)"/>
  <path d="M0 712 H900" stroke="#8A6259" stroke-width="2" opacity=".5"/>

  <!-- sun reflection -->
  <g fill="#F8DDB2">
    <ellipse cx="548" cy="724" rx="52" ry="6" opacity=".85"/>
    <ellipse cx="544" cy="748" rx="40" ry="5" opacity=".7"/>
    <ellipse cx="552" cy="776" rx="30" ry="4" opacity=".55"/>
    <ellipse cx="546" cy="808" rx="22" ry="3.4" opacity=".45"/>
    <ellipse cx="550" cy="846" rx="15" ry="2.8" opacity=".34"/>
    <ellipse cx="548" cy="890" rx="10" ry="2.2" opacity=".26"/>
  </g>

  <!-- ripples -->
  <g stroke="#D9AE8D" stroke-linecap="round" fill="none">
    <path d="M60 760 h120" stroke-width="3" opacity=".38"/>
    <path d="M250 792 h96" stroke-width="2.6" opacity=".3"/>
    <path d="M640 770 h130" stroke-width="3" opacity=".34"/>
    <path d="M720 830 h110" stroke-width="2.4" opacity=".26"/>
    <path d="M120 866 h150" stroke-width="2.6" opacity=".2"/>
    <path d="M400 926 h180" stroke-width="2.4" opacity=".16"/>
    <path d="M60 980 h110" stroke-width="3" opacity=".14"/>
    <path d="M620 1000 h150" stroke-width="2.4" opacity=".12"/>
  </g>

  <!-- distant boat -->
  <g opacity=".55">
    <path d="M212 686 l54 0 -8 9 -38 0 z" fill="#4B3733"/>
    <path d="M238 686 v-30 l22 16 z" fill="#4B3733"/>
  </g>

  <!-- reeds -->
  <g stroke="#3F322E" fill="none" stroke-linecap="round">
    <path d="M70 1100 C 84 1010 74 940 58 872" stroke-width="4" opacity=".8"/>
    <path d="M104 1100 C 112 1030 108 962 96 906" stroke-width="3" opacity=".7"/>
    <path d="M140 1100 C 148 1044 152 1006 158 962" stroke-width="2.4" opacity=".55"/>
    <path d="M172 1100 C 180 1052 190 1024 204 996" stroke-width="2" opacity=".45"/>
  </g>
  <g fill="#43342F">
    <ellipse cx="57" cy="866" rx="6" ry="15" opacity=".85"/>
    <ellipse cx="95" cy="900" rx="5" ry="12" opacity=".7"/>
    <ellipse cx="158" cy="956" rx="4" ry="9" opacity=".55"/>
  </g>

  <rect width="900" height="1100" fill="url(#vig)"/>
  <rect width="900" height="1100" filter="url(#grain)" opacity=".16" style="mix-blend-mode:multiply"/>
</svg>
