server {
    listen 80;
    listen [::]:80;
    server_name art.ladyzenko.ru;
    root /var/www/art.ladyzenko.ru/current;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/art.ladyzenko.ru/acme;
        try_files $uri =404;
    }
    location / { return 301 https://art.ladyzenko.ru$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name art.ladyzenko.ru;
    root /var/www/art.ladyzenko.ru/current;
    index index.html;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/art.ladyzenko.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/art.ladyzenko.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript image/svg+xml;

    error_page 404 /404.html;
    location = /new { return 301 /new/$is_args$args; }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
    access_log /var/log/nginx/art.ladyzenko.ru.access.log;
    error_log /var/log/nginx/art.ladyzenko.ru.error.log;
}
