server {
    listen 80;
    listen [::]:80;
    server_name art.ladyzenko.ru;
    root /var/www/art.ladyzenko.ru/current;
    index index.html;
    charset utf-8;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/art.ladyzenko.ru/acme;
        try_files $uri =404;
    }
    location = /new { return 301 /new/$is_args$args; }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
